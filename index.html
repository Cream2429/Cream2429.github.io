<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glacier Kumu - 3D Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --pastel-blue: #a8d8ea;
            --pastel-pink: #faccd5;
            --pastel-purple: #e0c3fc;
            --pastel-light-blue: #e0f7fa;
            --text-color: #5a5a7a;
            --bg-glass: rgba(255, 255, 255, 0.45);
            --shadow-color: rgba(168, 216, 234, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Kanit', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #e0f7fa 0%, #faccd5 100%);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
        }

        /* 3D Canvas Background */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlay UI Container */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Card Component */
        .portfolio-card {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow-color);
            transform: translateY(0);
            transition: all 0.4s ease;
            animation: fadeIn 1.2s ease-out;
        }

        .portfolio-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(250, 204, 213, 0.6);
        }

        .avatar-placeholder {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 4px solid #fff;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #4a4e69;
            margin-bottom: 5px;
        }

        .pen-name {
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(45deg, #7b2cbf, #ff9ebb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #6c5ce7;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555577;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            color: #6c5ce7;
            text-decoration: none;
            font-size: 1.3rem;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-btn:hover {
            transform: scale(1.18) rotate(6deg);
            background: var(--pastel-pink);
            color: #fff;
            box-shadow: 0 10px 20px rgba(250, 204, 213, 0.8);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .portfolio-card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .social-btn {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas สำหรับ Three.js 3D Background -->
    <div id="webgl-container"></div>

    <!-- UI Overlay (บัตรนำเสนอผลงาน) -->
    <div class="ui-container">
        <div class="portfolio-card">
            <div class="avatar-placeholder">
                <i class="fa-solid fa-paint-brush"></i>
            </div>
            <h1>Jaranya Tosanhuan</h1>
            <div class="pen-name">Glacier Kumu</div>
            <div class="badge">Character Design & Concept Art</div>
            <p class="bio">
                สวัสดีครับ/ค่ะ! เมมเบอร์ของโลกจินตนาการ หลงรักในการออกแบบตัวละครและสร้างสรรค์ Concept Art โทนสีสันสดใสชวนฝัน ✨
            </p>
            
            <div class="social-links">
                <a href="https://www.facebook.com/glacier.kumu/" target="_blank" class="social-btn" title="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/kuximumu_" target="_blank" class="social-btn" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://x.com/kuximumu_" target="_blank" class="social-btn" title="Twitter (X)">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="https://www.tiktok.com/@kuximumu_" target="_blank" class="social-btn" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Import Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 3D Script -->
    <script>
        // 1. Scene, Camera, Renderer Setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Add subtle background fog for depth
        scene.fog = new THREE.FogExp2(0xe0f7fa, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xa8d8ea, 1.2); // Pastel Blue Light
        directionalLight1.position.set(5, 5, 5);
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xfaccd5, 1.2); // Pastel Pink Light
        directionalLight2.position.set(-5, -5, -5);
        scene.add(directionalLight2);

        // 3. Create Pastel 3D Floating Objects
        const shapes = [];
        const colors = [0xa8d8ea, 0xfaccd5, 0xe0c3fc, 0xffdac1, 0xb5ead7];

        // Geometries
        const geometries = [
            new THREE.IcosahedronGeometry(1.5, 0),
            new THREE.TorusGeometry(1.2, 0.5, 16, 50),
            new THREE.OctahedronGeometry(1.5, 0),
            new THREE.SphereGeometry(1.2, 32, 32),
            new THREE.ConeGeometry(1, 2, 4)
        ];

        // Create 40 floating background objects
        for (let i = 0; i < 40; i++) {
            const randomGeometry = geometries[Math.floor(Math.random() * geometries.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const material = new THREE.MeshPhongMaterial({
                color: randomColor,
                shininess: 60,
                flatShading: true,
                transparent: true,
                opacity: 0.85
            });

            const mesh = new THREE.Mesh(randomGeometry, material);

            // Random Position
            mesh.position.x = (Math.random() - 0.5) * 60;
            mesh.position.y = (Math.random() - 0.5) * 60;
            mesh.position.z = (Math.random() - 0.5) * 40 - 10;

            // Random Rotation
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;

            // Custom speeds for animation
            mesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.015,
                rotSpeedY: (Math.random() - 0.5) * 0.015,
                floatSpeed: Math.random() * 0.02 + 0.005,
                floatOffset: Math.random() * Math.PI * 2
            };

            scene.add(mesh);
            shapes.push(mesh);
        }

        // 4. Mouse Interactive Parallax Effect
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
        });

        // 5. Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate and Float Objects
            shapes.forEach(shape => {
                shape.rotation.x += shape.userData.rotSpeedX;
                shape.rotation.y += shape.userData.rotSpeedY;
                
                // Floating Up & Down movement
                shape.position.y += Math.sin(elapsedTime * 2 + shape.userData.floatOffset) * 0.02;
            });

            // Camera follow mouse smoothly (Parallax Effect)
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        // 6. Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
